name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  release:
    types:
      - released

permissions:
  contents: read

jobs:
  build:
    # Windows, so the net481 test target runs too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test NExtends.sln --configuration Release

      # A release packs the version of its tag (v2.4.0 -> 2.4.0), any other build a throwaway CI version.
      - name: Pack
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then version="${REF_NAME#v}"; else version="0.0.0-ci.$RUN_NUMBER"; fi
          dotnet pack NExtends/NExtends.csproj --configuration Release --no-build --output artifacts -p:PackageVersion="$version"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: artifacts/*

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: artifacts

      # nuget.org trusted publishing: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
